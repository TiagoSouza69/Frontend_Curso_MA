    <form action="" method="post">
       <h4>Seu nome:</h4>
        <input type="text" name="username" placeholder="Seu nome" pattern="\w+"></br>
        <h4>Seu Zap:</h4>
        <input type="tel" name="phone" data-mask="(00) 0000-0000" pattern="([0-9]){3}[0-9]-{4}[0-9]{4}" placeholder="Seu Whatsapp" ><br>
        <h4>Curso de sua escolha:</h4>
       <select name="cursos" id="" required>
         <option value="" disabled selected>Selecione: </option>
        <option value="Office">Microsoft Office</option>
        <option value="Sec">Segurança da Informação</option>
        <option value="Comp">Manutenção de Computadores</option>
        <option value="Dev">Desenvolvimento Web</option>
        <option value="Net">Redes de Computadores</option>
       </select>
        <input  type="button" value="Enviar">

    </form>
